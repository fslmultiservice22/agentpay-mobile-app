name: AgentPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-financial-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: ESLint
        run: pnpm lint

      - name: Native API origin regression gate (offline)
        run: |
          NODE_OPTIONS=--require=./tests/helpers/api-origin-deny-network.cjs node -e 'try { require("node:net").connect(1, "127.0.0.1"); process.exit(9); } catch (error) { process.exit(error.message === "AUDIT_NETWORK_BLOCKED" ? 0 : 8); }'
          NODE_OPTIONS=--require=./tests/helpers/api-origin-deny-network.cjs node tests/api-origin-native-gate.runner.cjs "$RUNNER_TEMP/api-origin-results.json"

      - name: Financial boundary and regression tests
        run: pnpm test:ci

      - name: Backend build
        run: pnpm build

      - name: Prelaunch configuration gate (offline)
        run: pnpm eas:prelaunch:check
        env:
          EAS_PREFLIGHT_OFFLINE: "1"

name: AgentPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-financial-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: ESLint
        run: pnpm lint

      - name: Financial boundary and regression tests
        run: pnpm test:ci

      - name: Install MySQL 8 binaries for disposable integration tests
        run: |
          packages=()
          if ! mysqld --version 2>/dev/null | grep -Eq 'Ver 8\.'; then
            packages+=(mysql-server-core-8.0)
          fi
          if ! mysql --version 2>/dev/null | grep -Eq 'Ver 8\.'; then
            packages+=(mysql-client-core-8.0)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          mysqld --version
          mysql --version

      - name: Disposable MySQL 8 OAuth and session integration tests
        run: pnpm test:auth:mysql

      - name: Backend build
        run: pnpm build

      - name: Prelaunch configuration gate (offline)
        run: pnpm eas:prelaunch:check
        env:
          EAS_PREFLIGHT_OFFLINE: "1"
